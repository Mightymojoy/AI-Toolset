<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITO · AI 工具集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0B1A;
  --text:#F8FAFC;
  --text-dim:rgba(248,250,252,.66);
  --text-faint:rgba(248,250,252,.42);
  --glass-bg:rgba(255,255,255,.05);
  --glass-bg-strong:rgba(255,255,255,.08);
  --glass-border:rgba(255,255,255,.12);
  --nav-bg:rgba(10,11,26,.55);
  --violet:#7C3AED;
  --pink:#EC4899;
  --cyan:#06B6D4;
  --grad:linear-gradient(135deg,#7C3AED 0%,#EC4899 100%);
  --glow-1:rgba(124,58,237,.40);
  --glow-2:rgba(236,72,153,.34);
  --glow-3:rgba(6,182,212,.30);
  --shadow:0 20px 60px -20px rgba(0,0,0,.65);
  --radius:20px;
  --radius-sm:14px;
}
body.light{
  --bg:#EEF0F8;
  --text:#161527;
  --text-dim:rgba(22,21,39,.66);
  --text-faint:rgba(22,21,39,.44);
  --glass-bg:rgba(255,255,255,.62);
  --glass-bg-strong:rgba(255,255,255,.78);
  --glass-border:rgba(22,21,39,.10);
  --nav-bg:rgba(238,240,248,.7);
  --glow-1:rgba(124,58,237,.22);
  --glow-2:rgba(236,72,153,.18);
  --glow-3:rgba(6,182,212,.20);
  --shadow:0 20px 50px -24px rgba(60,40,120,.30);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background .4s ease,color .4s ease;
}
.bg-layer{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(60% 50% at 18% 12%, var(--glow-1), transparent 60%),
    radial-gradient(55% 45% at 85% 18%, var(--glow-2), transparent 60%),
    radial-gradient(60% 55% at 70% 95%, var(--glow-3), transparent 62%),
    var(--bg);
  transition:background .4s ease;
}
.bg-stars{
  position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.5px 1.5px at 75% 22%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 88% 60%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 60% 85%, rgba(255,255,255,.45), transparent),
    radial-gradient(1px 1px at 33% 50%, rgba(255,255,255,.4), transparent);
}
#progress{
  position:fixed;top:0;left:0;right:0;height:3px;z-index:200;
  transform:scaleX(0);transform-origin:left;
  background:var(--grad);
  box-shadow:0 0 12px rgba(236,72,153,.6);
}
#jsError{
  position:fixed;top:0;left:0;right:0;z-index:999;display:none;
  background:#EF4444;color:#fff;font-size:13px;padding:8px 16px;
  font-family:"JetBrains Mono",monospace;
}
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  background:var(--nav-bg);border-bottom:1px solid var(--glass-border);
  transition:background .3s ease,padding .3s ease;
}
.nav.scrolled{padding:10px 28px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16px;letter-spacing:.2px}
.brand .logo{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:var(--grad);box-shadow:0 6px 18px -6px rgba(236,72,153,.7);
}
.brand .logo svg{width:19px;height:19px;stroke:#fff}
.brand small{display:block;font-size:10px;font-weight:500;color:var(--text-faint);letter-spacing:1.5px;font-family:"JetBrains Mono",monospace}
.nav-links{display:flex;gap:6px;align-items:center}
.nav-links a{
  color:var(--text-dim);text-decoration:none;font-size:13.5px;font-weight:500;
  padding:8px 13px;border-radius:10px;transition:color .2s,background .2s;
}
.nav-links a:hover{color:var(--text);background:var(--glass-bg)}
.nav-right{display:flex;align-items:center;gap:10px}
.icon-btn{
  height:38px;border-radius:11px;border:1px solid var(--glass-border);
  background:var(--glass-bg);color:var(--text);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;padding:0 12px;
  font-family:inherit;font-size:13px;font-weight:600;
  transition:transform .2s,background .2s,border-color .2s;
}
.icon-btn:hover{transform:translateY(-2px);background:var(--glass-bg-strong);border-color:var(--pink)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor}
.hero{max-width:1080px;margin:0 auto;padding:150px 28px 60px;text-align:center}
.tag{
  display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  letter-spacing:.5px;padding:7px 15px;border-radius:999px;
  background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text-dim);
  font-family:"JetBrains Mono",monospace;
}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.hero h1{
  margin:22px 0 14px;font-size:clamp(40px,7vw,72px);font-weight:800;line-height:1.05;letter-spacing:-1px;
}
.hero h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{max-width:560px;margin:0 auto;color:var(--text-dim);font-size:16.5px}
.search-wrap{
  max-width:520px;margin:34px auto 0;position:relative;display:flex;align-items:center;
}
.search-wrap svg.s-icon{position:absolute;left:16px;width:18px;height:18px;stroke:var(--text-faint)}
.search-wrap input{
  width:100%;padding:15px 18px 15px 46px;border-radius:14px;font-size:15px;
  background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);outline:none;
  transition:border-color .2s,background .2s;font-family:inherit;
}
.search-wrap input::placeholder{color:var(--text-faint)}
.search-wrap input:focus{border-color:var(--pink);background:var(--glass-bg-strong)}
.stats{display:flex;gap:14px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.stat{
  background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;
  padding:14px 22px;min-width:120px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.stat b{display:block;font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:"JetBrains Mono",monospace}
.stat span{font-size:12.5px;color:var(--text-dim)}
.wrap{max-width:1080px;margin:0 auto;padding:30px 28px 60px}
.cat-section{margin-top:54px;scroll-margin-top:90px}
.cat-head{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.cat-head .c-icon{
  width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:var(--glass-bg);border:1px solid var(--glass-border);
}
.cat-head .c-icon svg{width:23px;height:23px;stroke:var(--accent,#7C3AED)}
.cat-head h2{font-size:22px;font-weight:700;letter-spacing:-.3px}
.cat-head .count{
  margin-left:auto;font-size:12.5px;color:var(--text-faint);font-family:"JetBrains Mono",monospace;
  background:var(--glass-bg);border:1px solid var(--glass-border);padding:5px 12px;border-radius:999px;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.tool-card{
  position:relative;display:block;text-decoration:none;color:inherit;
  background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius);
  padding:22px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow);transition:transform .3s ease,border-color .3s ease,background .3s ease;
  overflow:hidden;
}
.tool-card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(135deg,var(--accent),transparent 55%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;
}
.tool-card:hover{transform:translateY(-6px);background:var(--glass-bg-strong)}
.tool-card:hover::before{opacity:.9}
.icon-chip{
  width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:16px;
  background:rgba(124,58,237,.16);
}
.a-violet .icon-chip{background:rgba(124,58,237,.16)}
.a-pink .icon-chip{background:rgba(236,72,153,.16)}
.a-cyan .icon-chip{background:rgba(6,182,212,.16)}
.icon-chip svg{width:24px;height:24px;stroke:var(--accent,#7C3AED)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tool-card h3{font-size:16.5px;font-weight:650;letter-spacing:-.2px;line-height:1.35}
.tool-card .desc{margin-top:7px;font-size:13.5px;color:var(--text-dim)}
.tool-card .host{
  margin-top:14px;font-size:11.5px;color:var(--text-faint);font-family:"JetBrains Mono",monospace;
  display:flex;align-items:center;gap:6px;
}
.tool-card .host svg{width:12px;height:12px;stroke:var(--text-faint);flex:none}
.ext{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--glass-bg);border:1px solid var(--glass-border);transition:transform .25s,background .25s}
.tool-card:hover .ext{transform:translate(2px,-2px);background:var(--accent);border-color:var(--accent)}
.tool-card:hover .ext svg{stroke:#fff}
.ext svg{width:15px;height:15px;stroke:var(--text-dim);transition:stroke .25s}
.lock-badge{
  position:absolute;top:16px;right:16px;font-size:10.5px;font-weight:600;letter-spacing:.5px;
  padding:4px 9px;border-radius:999px;background:rgba(245,158,11,.16);color:#FBBF24;
  border:1px solid rgba(245,158,11,.3);display:inline-flex;align-items:center;gap:4px;
}
.lock-badge svg{width:11px;height:11px;stroke:#FBBF24}
.tool-card.locked{opacity:.82}
.tool-card.locked .ext{display:none}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);display:none}
.empty-state svg{width:42px;height:42px;stroke:var(--text-faint);margin-bottom:14px}
.empty-state.show{display:block}
.footer{max-width:1080px;margin:40px auto 0;padding:34px 28px 60px;text-align:center;
  border-top:1px solid var(--glass-border);color:var(--text-faint);font-size:13px}
.footer .ver{font-family:"JetBrains Mono",monospace;font-size:11.5px;margin-top:8px;opacity:.8}
.is-hidden{display:none !important}
body.js .reveal{opacity:0;transform:translateY(20px)}
body.js .reveal.in{opacity:1;transform:none;transition:opacity .6s ease,transform .6s ease}
@media(max-width:760px){
  .nav-links{display:none}
  .hero{padding-top:120px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
  body.js .reveal{opacity:1 !important;transform:none !important}
}
</style>
</head>

    globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'
  };
  function svg(key){
    return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[key]+'</svg>';

  /* ---------- data (real AI-Toolset content, bilingual) ---------- */
  var CATS = [{"key": "dash", "label": {"zh": "数据看板", "en": "Dashboards"}, "icon": "dashboard", "accent": "#7C3AED"}, {"key": "docs", "label": {"zh": "知识库与文档", "en": "Docs & Knowledge"}, "icon": "bookOpen", "accent": "#EC4899"}, {"key": "create", "label": {"zh": "内容创作工具", "en": "Content Tools"}, "icon": "pen", "accent": "#06B6D4"}, {"key": "sheet", "label": {"zh": "数据表", "en": "Data Tables"}, "icon": "table", "accent": "#7C3AED"}, {"key": "news", "label": {"zh": "AI资讯", "en": "AI News"}, "icon": "news", "accent": "#EC4899"}];
  var TOOLS = [{"cat": "dash", "name": "ITO产品销售分析看板", "url": "https://ito-opal.vercel.app/product_dashboard.html", "icon": "barChart", "desc": {"zh": "按系列 SKU 拆解销售表现", "en": "Sales performance by series and SKU"}, "locked": false}, {"cat": "dash", "name": "ITO电商渠道业绩看板", "url": "https://ito-opal.vercel.app/channel_dashboard.html", "icon": "trending", "desc": {"zh": "9 渠道月度目标与实际追踪", "en": "9 channels: monthly target vs actual"}, "locked": false}, {"cat": "docs", "name": "ITO产品介绍", "url": "https://mightymojoy.github.io/-product/index.html", "icon": "book", "desc": {"zh": "全系产品资料与卖点", "en": "Full product catalog and selling points"}, "locked": false}, {"cat": "dash", "name": "抖音主播数据看板", "url": "https://mightymojoy.github.io/live-dashboard/index.html", "icon": "monitor", "desc": {"zh": "三店主播实时直播数据", "en": "Live-stream data across 3 stores"}, "locked": false}, {"cat": "dash", "name": "抖音主播数据趋势分析", "url": "https://mightymojoy.github.io/live-dashboard/trend.html", "icon": "activity", "desc": {"zh": "主播历史趋势与对比", "en": "Host trends and comparison"}, "locked": false}, {"cat": "dash", "name": "抖音店铺数据看板", "url": "https://mightymojoy.github.io/douyin_dashboard/", "icon": "store", "desc": {"zh": "抖音自营店铺经营概览", "en": "Douyin store operations overview"}, "locked": false}, {"cat": "create", "name": "ITO内容短视频脚本生成器", "url": "https://mightymojoy.github.io/NEW-DY-short-videos/", "icon": "video", "desc": {"zh": "抖音短视频脚本一键生成", "en": "One-click Douyin short-video scripts"}, "locked": false}, {"cat": "create", "name": "ITO摄影提示词精准控制生成", "url": "https://mightymojoy.github.io/ITO-PROMPT-STUDIO/ITO-Prompt-Studio.html", "icon": "camera", "desc": {"zh": "产品摄影提示词工坊", "en": "Product photography prompt studio"}, "locked": false}, {"cat": "docs", "name": "ITO新品介绍", "url": "https://itonewproduct.vercel.app/", "icon": "sparkles", "desc": {"zh": "新品上市资料中心", "en": "New product launch resource center"}, "locked": false}, {"cat": "dash", "name": "京东毛保监控", "url": "https://66396c5698674ebe9ee8a78092ef1298.app.codebuddy.work/", "icon": "shield", "desc": {"zh": "京东自营毛利保护每日看板", "en": "JD self-operated margin protection daily"}, "locked": false}, {"cat": "dash", "name": "店铺优惠券数据监控", "url": "https://metabase.doris.itocases.com/question/81?trade_time=2026-07&shop_no=01", "icon": "ticket", "desc": {"zh": "优惠券投放与核销监控", "en": "Coupon delivery and redemption monitor"}, "locked": false}, {"cat": "docs", "name": "新品上线进度概览", "url": "https://eb9eff2f00b04a7793204efaf962e601.app.codebuddy.work/", "icon": "kanban", "desc": {"zh": "新品上市流程进度看板", "en": "New product launch progress board"}, "locked": false}, {"cat": "docs", "name": "ITO AI AGENT 测试", "url": "https://ito-ai-grading.vercel.app/agent-exam.html", "icon": "bot", "desc": {"zh": "AI 评分与 Agent 测试台", "en": "AI scoring and agent testing bench"}, "locked": false}, {"cat": "dash", "name": "ITO库存看板", "url": "https://ito-inventory-dashboard.vercel.app/", "icon": "package", "desc": {"zh": "全渠道库存水位与周转", "en": "Omni-channel inventory and turnover"}, "locked": false}, {"cat": "dash", "name": "数据取数-专用", "url": "https://www.workbuddy.cn/space/d/jDu4Ocn1uGT0fPyM1wVzpI?preview=1&source=3", "icon": "dashboard", "desc": {"zh": "按系列 / 渠道追踪各项数据", "en": "Track data by series and channel"}, "locked": false}, {"cat": "sheet", "name": "每日库存表", "url": "https://my.feishu.cn/wiki/CgBmw84OSikaKZk0jImckrNjnug?sheet=kGV1ky", "icon": "table", "desc": {"zh": "飞书每日库存明细表", "en": "Feishu daily inventory sheet"}, "locked": false}, {"cat": "sheet", "name": "京东毛保", "url": "https://my.feishu.cn/wiki/W6vewSdagixfhOkNqA0cAWtPn2e?sheet=iC9wkH", "icon": "table", "desc": {"zh": "京东毛保明细数据表", "en": "JD margin-protection data sheet"}, "locked": false}, {"cat": "sheet", "name": "电商渠道业绩", "url": "https://my.feishu.cn/sheets/CtZuseYAyhrJPgtGBxFc755Vnge?sheet=JOlwMJ", "icon": "table", "desc": {"zh": "渠道业绩明细表", "en": "Channel performance sheet"}, "locked": false}, {"cat": "sheet", "name": "电商渠道商品", "url": "https://my.feishu.cn/sheets/RKudsmnm3h2cOPtvv4ScTEzSnCh", "icon": "table", "desc": {"zh": "渠道在售商品表", "en": "Channel product listing sheet"}, "locked": false}, {"cat": "sheet", "name": "新品上市全流程", "url": "https://my.feishu.cn/wiki/QWb6wpxXAiBjsjk3o9Qc98HunNe?table=tbljqLJy1V5S4cFP&view=vewfJNQRH2#CategoryAutomatedNotification", "icon": "table", "desc": {"zh": "新品上市流程管理表", "en": "New product launch workflow sheet"}, "locked": false}, {"cat": "docs", "name": "AI培训视频讲解", "url": "", "icon": "play", "desc": {"zh": "AI 实操培训视频（待解锁）", "en": "AI hands-on training videos (locked)"}, "locked": true}, {"cat": "news", "name": "AI HOT 每日晨报", "url": "https://4ac9877daaf74f81962a2b05a0d57e25.gz2.agentos-app.net/", "icon": "zap", "desc": {"zh": "每日 AI 行业早报", "en": "Daily AI industry morning brief"}, "locked": false}, {"cat": "news", "name": "行业日报", "url": "https://linnetwu.github.io/Industry-Daily/", "icon": "news", "desc": {"zh": "AI 行业每日速览", "en": "Daily AI industry digest"}, "locked": false}];
  TOOLS.forEach(function(t,i){t._i=i;});

  var ACCENTS = ['a-violet','a-pink','a-cyan'];
  var catLabel = {};
  CATS.forEach(function(c){catLabel[c.key]=c.label;});

  /* ---------- render ---------- */
  var main = document.getElementById('main');
  var navLinks = document.getElementById('navLinks');
  var frag = document.createDocumentFragment();

  CATS.forEach(function(cat){
    var items = TOOLS.filter(function(t){return t.cat===cat.key;});
    if(!items.length) return;

    var sec = document.createElement('section');
    sec.className = 'cat-section';
    sec.id = 'cat-'+cat.key;
    sec.style.setProperty('--accent',cat.accent);

    var head = document.createElement('div');
    head.className = 'cat-head reveal';
    head.innerHTML = '<span class="c-icon">'+svg(cat.icon)+'</span>'+
      '<h2 data-cat="'+cat.key+'">'+cat.label.zh+'</h2>'+
      '<span class="count" data-count="'+items.length+'"></span>';
    sec.appendChild(head);

    var grid = document.createElement('div');
    grid.className = 'grid';

    items.forEach(function(t,idx){
      var a = document.createElement('a');
      a.className = 'tool-card reveal '+ACCENTS[idx%3]+(t.locked?' locked':'');
      a.href = t.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.dataset.name = t.name;
      a.dataset.desc = t.desc.zh;
      var host = (function(){try{return new URL(t.url).hostname;}catch(e){return '';}})();
      a.innerHTML =
        (t.locked?('<span class="lock-badge">'+svg('lock')+'<span data-i18n="locked">待解锁</span></span>'):'')+
        '<div class="card-top">'+
          '<div class="icon-chip">'+svg(t.icon)+'</div>'+
          (t.locked?'':'<span class="ext">'+svg('ext')+'</span>')+
        '</div>'+
        '<h3>'+t.name+'</h3>'+
        '<p class="desc" data-desc="'+t._i+'">'+t.desc.zh+'</p>'+
        '<div class="host">'+svg('ext')+'<span>'+host+'</span></div>';
      grid.appendChild(a);
    });

    sec.appendChild(grid);
    frag.appendChild(sec);

    var link = document.createElement('a');
    link.href = '#cat-'+cat.key;
    link.setAttribute('data-cat-link',cat.key);
    link.textContent = cat.label.zh;
    navLinks.appendChild(link);
  });
  main.appendChild(frag);

  /* ---------- stats ---------- */
  var stats = document.getElementById('stats');
  var statData = [
    {n:TOOLS.length,labelKey:'statsTools'},
    {n:CATS.length,labelKey:'statsCats'},
    {n:TOOLS.filter(function(t){return t.cat==='dash';}).length,labelKey:'statsDash'}
  ];
  stats.innerHTML = statData.map(function(s){
    return '<div class="stat reveal"><b>'+s.n+'</b><span data-i18n="'+s.labelKey+'"></span></div>';
  }).join('');

  /* ---------- language ---------- */
  var langBtn = document.getElementById('langBtn');
  var search = document.getElementById('search');
  var lang = 'zh';
  function applyLang(l){
    lang = l;
    document.documentElement.lang = (l==='en'?'en':'zh-CN');
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var k = el.getAttribute('data-i18n');
      if(I18N[l][k]!=null) el.textContent = I18N[l][k];
    });
    document.querySelectorAll('[data-desc]').forEach(function(el){
      var t = TOOLS[+el.getAttribute('data-desc')];
      if(t) el.textContent = t.desc[l];
    });
    document.querySelectorAll('[data-cat]').forEach(function(el){
      var c = catLabel[el.getAttribute('data-cat')];
      if(c) el.textContent = c[l];
    });
    document.querySelectorAll('[data-cat-link]').forEach(function(el){
      var c = catLabel[el.getAttribute('data-cat-link')];
      if(c) el.textContent = c[l];
    });
    document.querySelectorAll('[data-count]').forEach(function(el){
      el.textContent = el.getAttribute('data-count')+' '+I18N[l].unitTools;
    });
    if(search) search.placeholder = I18N[l].searchPh;
    langBtn.innerHTML = svg('globe')+'<span>'+I18N[l].lang+'</span>';
    updateThemeAria();
  }
  langBtn.addEventListener('click',function(){
    var next = (lang==='zh')?'en':'zh';
    applyLang(next);
    try{localStorage.setItem('ito-toolset-lang',next);}catch(e){}
  });

  /* ---------- theme ---------- */
  var themeBtn = document.getElementById('themeBtn');
  function updateThemeAria(){
    themeBtn.setAttribute('aria-label', document.body.classList.contains('light')?I18N[lang].themeLight:I18N[lang].themeDark);
  }
  function applyTheme(t){
    if(t==='light'){document.body.classList.add('light');themeBtn.innerHTML=svg('sun');}
    else{document.body.classList.remove('light');themeBtn.innerHTML=svg('moon');}
    updateThemeAria();
  }
  var savedTheme = null, savedLang = null;
  try{savedTheme=localStorage.getItem('ito-toolset-theme');savedLang=localStorage.getItem('ito-toolset-lang');}catch(e){}
  applyTheme(savedTheme||'dark');
  applyLang(savedLang||'zh');
  themeBtn.addEventListener('click',function(){
    var next = document.body.classList.contains('light')?'dark':'light';
    applyTheme(next);
    try{localStorage.setItem('ito-toolset-theme',next);}catch(e){}
  });

  /* ---------- scroll progress + nav state ---------- */
  var progress = document.getElementById('progress');
  var nav = document.getElementById('nav');
  function onScroll(){
    var h = document.documentElement.scrollHeight - window.innerHeight;
    var p = h>0 ? window.scrollY/h : 0;
    progress.style.transform = 'scaleX('+p+')';
    nav.classList.toggle('scrolled', window.scrollY>20);
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  onScroll();

  /* ---------- search filter ---------- */
  var emptyState = document.getElementById('emptyState');
  search.addEventListener('input',function(){
    var q = search.value.trim().toLowerCase();
    var total = 0;
    document.querySelectorAll('.cat-section').forEach(function(sec){
      var vis = 0;
      sec.querySelectorAll('.tool-card').forEach(function(card){
        var hay = (card.dataset.name+' '+card.dataset.desc).toLowerCase();
        var show = !q || hay.indexOf(q)>-1;
        card.classList.toggle('is-hidden',!show);
        if(show) vis++;
      });
      sec.classList.toggle('is-hidden',vis===0);
      total += vis;
    });
    emptyState.classList.toggle('show',total===0);
  });

  /* ---------- reveal on scroll ---------- */
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || !('IntersectionObserver' in window)){
    document.querySelectorAll('.reveal').forEach(function(el){el.classList.add('in');});
  } else {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}
      });
    },{threshold:0.12,rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('.reveal').forEach(function(el,i){
      el.style.transitionDelay = (Math.min(i,8)*55)+'ms';
      io.observe(el);
    });
  }
})();
</script>
